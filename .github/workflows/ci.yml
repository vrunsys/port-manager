name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing OS must not hide the result of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check-types

      - name: Build
        run: node esbuild.js --production

      - name: Unit tests
        run: npm test

      # Starts a throwaway local server, then uses this OS's real tools to list ports, find it, and kill it.
      - name: Integration check
        run: npm run test:integration

  package:
    name: Build .vsix
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # The README links to docs/ by relative path; vsce needs a base URL for those links because
      # package.json has no "repository" field yet. The flags keep the build non-interactive.
      - name: Package
        run: >
          npx vsce package
          --no-dependencies
          --allow-missing-repository
          --skip-license
          --baseContentUrl "https://github.com/${{ github.repository }}/blob/main"
          --out port-manager.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: port-manager-vsix
          path: port-manager.vsix
          if-no-files-found: error
          retention-days: 30
